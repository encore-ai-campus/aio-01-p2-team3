<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" role="img" aria-labelledby="title desc">
  <title id="title">AI Baby Care Assistant StateGraph 상태 흐름도</title>
  <desc id="desc">요청 수신부터 입력 정규화, 안전 검사, 의도 분류, 검증, 도구 선택, 승인, 결과 검증, 답변, 종료까지의 흐름을 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif; fill:#172033; }
      .title { font-size:32px; font-weight:700; }
      .sub { font-size:16px; fill:#64748b; }
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:16; }
      .decision { fill:#f8faff; stroke:#7387e8; stroke-width:2; }
      .action { fill:#eef2ff; stroke:#8191e8; stroke-width:2; rx:16; }
      .warn { fill:#fff7ed; stroke:#fb923c; stroke-width:2; rx:16; }
      .end { fill:#f0fdf4; stroke:#4ade80; stroke-width:2; rx:16; }
      .label { font-size:20px; font-weight:700; text-anchor:middle; }
      .small { font-size:15px; text-anchor:middle; fill:#64748b; }
      .edge { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); }
      .edge-label { font-size:15px; font-weight:700; fill:#475569; }
    </style>
  </defs>
  <rect width="1200" height="1560" fill="#f8fafc"/>
  <text x="600" y="55" class="title" text-anchor="middle">AI Baby Care Assistant StateGraph 상태 흐름도</text>
  <text x="600" y="84" class="sub" text-anchor="middle">인지 → 판단 → 행동 → 검증</text>

  <rect x="430" y="115" width="340" height="74" class="box"/>
  <text x="600" y="158" class="label">요청 수신</text>
  <path d="M600 189 V220" class="edge"/>
  <rect x="430" y="225" width="340" height="74" class="box"/>
  <text x="600" y="268" class="label">입력 정규화</text>
  <path d="M600 299 V330" class="edge"/>
  <polygon points="600,330 760,405 600,480 440,405" class="decision"/>
  <text x="600" y="400" class="label">안전·권한 문제?</text>
  <path d="M600 480 V520" class="edge"/>
  <text x="615" y="512" class="edge-label">정상</text>
  <rect x="430" y="525" width="340" height="74" class="box"/>
  <text x="600" y="568" class="label">의도 분류</text>
  <path d="M600 599 V630" class="edge"/>
  <polygon points="600,630 760,705 600,780 440,705" class="decision"/>
  <text x="600" y="700" class="label">필수값 충분?</text>
  <path d="M600 780 V820" class="edge"/>
  <text x="615" y="812" class="edge-label">예</text>
  <rect x="430" y="825" width="340" height="74" class="box"/>
  <text x="600" y="868" class="label">관련 기억 선택</text>
  <path d="M600 899 V930" class="edge"/>
  <polygon points="600,930 760,1005 600,1080 440,1005" class="decision"/>
  <text x="600" y="1000" class="label">Tool 필요?</text>
  <path d="M600 1080 V1120" class="edge"/>
  <text x="615" y="1112" class="edge-label">예</text>
  <rect x="430" y="1125" width="340" height="74" class="action"/>
  <text x="600" y="1168" class="label">Tool 선택·정책 검증</text>
  <path d="M600 1199 V1230" class="edge"/>
  <polygon points="600,1230 760,1305 600,1380 440,1305" class="decision"/>
  <text x="600" y="1300" class="label">STT 실제 기록?</text>
  <path d="M600 1380 V1420" class="edge"/>
  <text x="615" y="1412" class="edge-label">아니오</text>
  <rect x="430" y="1425" width="340" height="74" class="action"/>
  <text x="600" y="1468" class="label">Tool 호출·결과 검증</text>

  <path d="M440 405 H225 V500" class="edge"/>
  <text x="270" y="395" class="edge-label">응급/차단</text>
  <rect x="55" y="505" width="340" height="86" class="warn"/>
  <text x="225" y="540" class="label">안전 안내 또는 접근 차단</text>
  <text x="225" y="565" class="small">즉시 종료</text>

  <path d="M440 705 H225 V800" class="edge"/>
  <text x="265" y="695" class="edge-label">아니오</text>
  <rect x="55" y="805" width="340" height="86" class="warn"/>
  <text x="225" y="840" class="label">보완 질문</text>
  <text x="225" y="865" class="small">필수값 입력 후 새 요청</text>

  <path d="M760 1005 H975 V1140" class="edge"/>
  <text x="810" y="995" class="edge-label">아니오</text>
  <rect x="805" y="1145" width="340" height="86" class="action"/>
  <text x="975" y="1180" class="label">답변 생성</text>
  <text x="975" y="1205" class="small">Tool 없이 안내</text>

  <path d="M760 1305 H975 V1390" class="edge"/>
  <text x="810" y="1295" class="edge-label">예</text>
  <rect x="805" y="1395" width="340" height="86" class="warn"/>
  <text x="975" y="1430" class="label">승인 Snapshot 저장</text>
  <text x="975" y="1455" class="small">STT 승인 대기 후 종료</text>

  <path d="M770 1462 H975 V1510" class="edge"/>
  <rect x="805" y="1515" width="340" height="38" class="end"/>
  <text x="975" y="1541" class="label" style="font-size:17px">최종 응답 / 종료</text>
</svg>
